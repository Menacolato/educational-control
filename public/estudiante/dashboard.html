<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estudiantes</title>
</head>
<body>

<h2>Estudiantes de la Materia</h2>

<table border="1">
<thead>
<tr>
<th>Nombre</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("/api/docente/estudiantes/" + id)
.then(res => res.json())
.then(data => {

    const tabla = document.getElementById("tabla");

    data.forEach(e => {
        tabla.innerHTML += `
        <tr>
            <td>${e.nombre}</td>
        </tr>
        `;
    });

});

</script>

</body>
</html>
