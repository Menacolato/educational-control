<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión de Materia</title>

<style>
body{
    font-family: Arial;
    background:#f3f4f6;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

table{
    width:100%;
    border-collapse: collapse;
}

th, td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

th{
    background:#2563eb;
    color:white;
}

.aprobado{
    color:green;
    font-weight:bold;
}

.reprobado{
    color:red;
    font-weight:bold;
}
button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.presente{
    background:#16a34a;
    color:white;
}
.ausente{
    background:#dc2626;
    color:white;
}
</style>
</head>
<body>

<h2>Gestión de Estudiantes</h2>

<div class="card">
    <h3>Promedios</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Promedio</th>
                <th>Estado</th>
                <th>Asistencia</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<div class="card">
    <h3>Promedio General</h3>
    <p id="promedioGeneral"></p>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");


// Cargar promedios
fetch("/api/docente/promedios/" + id)
.then(res => res.json())
.then(data => {

    const tabla = document.getElementById("tabla");

    data.forEach(e => {

        const estadoClass = e.estado === "Aprobado" ? "aprobado" : "reprobado";

        tabla.innerHTML += `
        <tr>
            <td>${e.nombre}</td>
            <td>${parseFloat(e.promedio).toFixed(2)}</td>
            <td class="${estadoClass}">${e.estado}</td>
            <td>
                <button class="presente" onclick="registrarAsistencia(${e.id},1)">✔</button>
                <button class="ausente" onclick="registrarAsistencia(${e.id},0)">✘</button>
            </td>
        </tr>
        `;
    });

});


// Promedio general
fetch("/api/docente/promedio-general/" + id)
.then(res => res.json())
.then(data => {
    document.getElementById("promedioGeneral").innerText =
        "Promedio General: " + parseFloat(data.promedio_general).toFixed(2);
});


function registrarAsistencia(estudiante_id, presente) {

    fetch("/api/docente/registrar-asistencia", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            docente_materia_id:id,
            estudiante_id,
            presente
        })
    })
    .then(res=>res.json())
    .then(data=>alert(data.message));
}

</script>

</body>
</html>
