<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Bachillerato</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f4f6;
    font-family: Arial, sans-serif;
}

.card{
    background:white;
    width:380px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    border:1px solid #ddd;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e40af;
}

.link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:14px;
}

.link a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h2>Bienvenido</h2>
    <div class="subtitle">Inicia sesión para continuar</div>

    <input type="email" id="correo" placeholder="Correo institucional">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="iniciarSesion()">Iniciar sesión</button>

    <div class="link">
        ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
    </div>
</div>
<script>
function iniciarSesion() {

    fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            correo: document.getElementById("correo").value,
            password: document.getElementById("password").value
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.rol) {   // 🔥 Si viene rol, login correcto

            if (data.rol === "estudiante")
                window.location.href = "estudiante/dashboard.html";

            if (data.rol === "docente")
                window.location.href = "docente/dashboard.html";

            if (data.rol === "admin")
                window.location.href = "admin/dashboard.html";

        } else {
            alert(data.error || data.message || "Error al iniciar sesión");
        }

    })
    .catch(() => alert("Error al conectar con el servidor"));
}
</script>
</body>
</html>
