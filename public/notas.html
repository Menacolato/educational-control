<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Notas</title>
<link rel="stylesheet" href="notas.css">
</head>
<!-- ICONOS -->
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family: Arial;
  background:#f4f6f9;
}

.container{
  width:80%;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
  color:#ffffff;
}

button{
  background:#3498db;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:5px;
}

button:hover{
  background:#2980b9;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#2c3e50;
  color:white;
}
.icon{
  margin-right:6px;
}
body{
    margin:0;
    font-family:'Segoe UI';
    background:url("img/light_in_classroom_image_800x500.png") center/cover no-repeat fixed;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px);
}

.layout{
    position:relative;
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#004c8f;
    color:white;
    height:100vh;
    padding:30px;
}

.sidebar h2{margin-bottom:40px;}

.sidebar a{
    display:block;
    color:white;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    text-decoration:none;
}

.sidebar a.active,
.sidebar a:hover{
    background:#3b82f6;
}

/* CONTENIDO */
.content{
    flex:1;
    padding:40px;
}

header h1{
    margin:0;
    font-size:32px;
}

.stats{
    display:flex;
    gap:20px;
    margin:30px 0;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    flex:1;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.card span{
    font-size:28px;
    color:#2563eb;
    font-weight:bold;
}

/* FORM */
.form-card{
    background:white;
    padding:25px;
    border-radius:14px;
    margin-bottom:30px;
}

.form-card form{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

input{
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}

/* TABLA */
.table-card{
    background:white;
    padding:25px;
    border-radius:14px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    border-bottom:1px solid #eee;
}

.estado-aprobado{color:green;font-weight:bold;}
.estado-reprobado{color:red;font-weight:bold;}</style>

<body>


<div class="overlay"></div>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Educacional Control</h2>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Profesores</a>
            <a href="#">Estudiantes</a>
            <a class="active">Notas</a>
        </nav>
    </aside>

    <!-- CONTENIDO -->
    <main class="content">

        <header>
            <h1>Registro de Notas</h1>
            <p>Gestión académica de estudiantes</p>
        </header>

        <!-- CARDS DE ESTADÍSTICAS -->
        <section class="stats">
            <div class="card">
                <h3>Total Estudiantes</h3>
                <span id="totalEstudiantes">0</span>
            </div>

            <div class="card">
                <h3>Promedio General</h3>
                <span id="promedioGeneral">0%</span>
            </div>

            <div class="card">
                <h3>Materias Registradas</h3>
                <span id="totalMaterias">0</span>
            </div>
        </section>

        <!-- FORMULARIO -->
        <section class="form-card">
            <form id="formNotas">
                <input id="estudiante" placeholder="Estudiante" required>
                <input id="materia" placeholder="Materia" required>
                <input id="nota1" type="number" step="0.01" placeholder="Nota 1" required>
                <input id="nota2" type="number" step="0.01" placeholder="Nota 2" required>
                <input id="nota3" type="number" step="0.01" placeholder="Nota 3" required>
                <button type="submit">Guardar</button>
            </form>
        </section>

        <!-- TABLA -->
        <section class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Materia</th>
                        <th>Promedio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaNotas"></tbody>
            </table>
        </section>

    </main>
</div>

<script src="notas.js"></script>
</body>
</html>
